[project]
name = "truelift"
version = "0.0.1"
description = "A local app that interviews a marketing leader, builds a causal DAG and measures discount ROI with doubleml-pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "RuslanKhis" }]
# Python 3.12 is pinned for the release unit (plan: "Pinned artefacts").
requires-python = ">=3.12,<3.13"
# Application dependencies arrive with G02 (FastAPI, ADK) and G03 (doubleml-pipeline).
dependencies = []

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truelift"]

[tool.hatch.build.targets.sdist]
# Explicit allowlist: nothing else from the repository reaches the sdist.
only-include = ["src/truelift", "tests", "scripts/guard_public.py"]

[tool.uv]
required-version = ">=0.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "private: needs the private benchmark materials (private/benchmark.yaml); skipped when they are absent",
    "e2e: end-to-end journey tests (G20)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
# Pre-existing maintenance script, outside G01; lint it in its own change.
extend-exclude = ["scripts/tickets_to_github.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The guard keeps Python 3.8 compatibility so it runs before uv provisions 3.12.
"scripts/guard_public.py" = ["UP"]
