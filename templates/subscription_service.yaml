# Business-type template (decisions D3, D5, D18). Owner: Thao (CODEOWNERS).
# See brand_via_retailers.yaml for how the DAG builder (G31) uses a template.

schema: truelift.template/1
id: subscription_service
title: A subscription service
description: >-
  Customers sign up and pay every month, for example for a gym, a meal box, a streaming or
  phone plan. Your discounts are introductory offers, such as a cheaper first month. Sales here
  means the revenue from new subscribers in the week they sign up.
treatment: discount
outcome: sales

nodes:
  - {id: discount, label: Your introductory offer, role: treatment, usually_observed: true}
  - {id: sales, label: Revenue from new subscribers, role: outcome, usually_observed: true}
  - {id: holiday_weeks, label: Holiday weeks, role: confounder, usually_observed: true}
  - {id: season, label: "The time of year, such as New Year resolutions", role: confounder, usually_observed: true, may_modify_effect: true}
  - {id: market_demand, label: How many people are looking for a service like yours, role: confounder, usually_observed: false}
  - {id: recent_sales_trend, label: A slow or strong spell in recent sign-ups, role: confounder, usually_observed: true}
  - {id: media, label: Your advertising, role: confounder, usually_observed: true}
  - {id: price_changes, label: Changes to your regular price, role: confounder, usually_observed: true}
  - {id: competitor_promo, label: Competitors' offers, role: predictor, usually_observed: false}
  - {id: macro_conditions, label: The economic mood, role: predictor, usually_observed: false, may_modify_effect: true}
  - {id: site_visits, label: People looking at your offer, role: mediator, usually_observed: true}
  - {id: trial_signups, label: Trial sign-ups, role: mediator, usually_observed: true}

edges:
  - from: discount
    to: sales
    default: present
    sentence: Your introductory offer changes how many people sign up.
    confirmed_by: [m3.discount_drivers]
  - from: holiday_weeks
    to: discount
    default: present
    sentence: You run offers in holiday weeks.
    confirmed_by: [m2.calendar_events, m3.discount_drivers]
  - from: holiday_weeks
    to: sales
    default: present
    sentence: Holiday weeks change how many people sign up, with or without an offer.
    confirmed_by: [m2.calendar_events]
  - from: season
    to: discount
    default: present
    sentence: You run offers at the times of year when people think about signing up.
    confirmed_by: [m2.seasons, m3.discount_drivers]
  - from: season
    to: sales
    default: present
    sentence: Sign-ups rise and fall with the time of year.
    confirmed_by: [m2.seasons]
  - from: market_demand
    to: discount
    default: present
    sentence: When fewer people are looking for a service like yours, you offer more.
    confirmed_by: [m3.slow_sales_response]
  - from: market_demand
    to: sales
    default: present
    sentence: When more people are looking for a service like yours, more of them sign up with you.
    confirmed_by: [m4.sales_drivers]
  - from: recent_sales_trend
    to: discount
    default: present
    sentence: After a few slow weeks of sign-ups, you are more likely to run an offer.
    confirmed_by: [m3.slow_sales_response]
  - from: recent_sales_trend
    to: sales
    default: present
    sentence: A slow or strong spell of sign-ups tends to carry on into the next weeks.
    confirmed_by: [m4.sales_drivers]
  - from: media
    to: discount
    default: present
    sentence: You run offers in the same weeks as your advertising.
    confirmed_by: [m3.media_alignment]
  - from: media
    to: sales
    default: present
    sentence: Your advertising brings in more sign-ups.
    confirmed_by: [m4.media]
  - from: price_changes
    to: discount
    default: present
    sentence: When you raise your regular price, you run offers to soften the change.
    confirmed_by: [m4.price_changes, m3.discount_drivers]
  - from: price_changes
    to: sales
    default: present
    sentence: Changes to your regular price change how many people sign up.
    confirmed_by: [m4.price_changes]
  - from: competitor_promo
    to: sales
    default: present
    sentence: Competitors' offers take sign-ups away from you.
    confirmed_by: [m4.competitor_activity]
  - from: competitor_promo
    to: discount
    default: absent
    sentence: You run offers in answer to competitors' offers.
    confirmed_by: [m3.competitor_response]
  - from: macro_conditions
    to: sales
    default: present
    sentence: When the economy is weak, fewer people sign up.
    confirmed_by: [m2.macro_conditions]
  - from: discount
    to: site_visits
    default: present
    sentence: An offer makes more people look at your service.
    confirmed_by: [m5.discount_side_effects]
  - from: site_visits
    to: trial_signups
    default: present
    sentence: People who look at your service start a trial.
    confirmed_by: [m5.discount_side_effects]
  - from: trial_signups
    to: sales
    default: present
    sentence: Trials turn into paying subscribers.
    confirmed_by: [m5.discount_side_effects]
