schema: truelift.golden/1
id: g11_collider_confounder
title: A collider that is also a confounder blocks the run
covers: [collider, unobserved_no_proxy]
template: brand_via_retailers
rationale: >-
  As in g10, but now listings also drive both the discount and sales. Leaving listings out keeps
  discount <- listings -> sales open; controlling for them opens discount <- price_pressure ->
  listings <- brand_strength -> sales. No set of the available columns closes both, so the run
  is blocked and the two unobserved causes behind the listings are named. Data on either of them
  would be enough.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
    - {id: retailer_listings, role: confounder, column: listing_count}
    - {id: price_pressure}
    - {id: brand_strength}
  edges:
    - [discount, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
    - [retailer_listings, discount]
    - [retailer_listings, sales]
    - [price_pressure, discount]
    - [price_pressure, retailer_listings]
    - [brand_strength, retailer_listings]
    - [brand_strength, sales]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
    - {name: listing_count, role: control, type: count}
data: {weeks: 156, regions: 8, rows: 1248, treated_share: 0.35, untreated_share: 0.4, treatment_levels: 6, gap_share: 0.0}
expected:
  decision: blocked
  blocks:
    - {code: unobserved_confounder, node_ids: [brand_strength], remedies: [add_data, accept_risk]}
    - {code: unobserved_confounder, node_ids: [price_pressure], remedies: [add_data, accept_risk]}
