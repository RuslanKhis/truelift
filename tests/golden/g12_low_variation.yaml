schema: truelift.golden/1
id: g12_low_variation
title: Discounts ran in too few region-weeks
covers: [low_variation]
template: online_shop
rationale: >-
  The DAG is fine, but only 4% of region-weeks had a discount, below the 10% in
  rules/identification.yaml. The effect would rest on a handful of weeks, so the run is blocked
  and the user is told how many discount weeks are needed.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
  edges:
    - [discount, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
data: {weeks: 156, regions: 8, rows: 1248, treated_share: 0.04, untreated_share: 0.96, treatment_levels: 3, gap_share: 0.0}
expected:
  decision: blocked
  blocks:
    - {code: too_few_treated_rows, remedies: [add_data]}
