schema: truelift.golden/1
id: g03_mediator_trap
title: Store traffic is caused by the discount and stays out
covers: [mediator_trap]
template: store_chain
rationale: >-
  The discount brings people into the shops, and those people buy. Store traffic is on the way
  from the discount to sales, so controlling for it would remove most of the effect being
  measured. The user labelled it correctly as something the discount changes, so it is simply
  left out: the footfall column has data but is not a control.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
    - {id: store_traffic, role: mediator, column: footfall}
  edges:
    - [discount, sales]
    - [discount, store_traffic]
    - [store_traffic, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
    - [holiday_weeks, store_traffic]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
    - {name: footfall, role: control, type: volume}
data: {weeks: 156, regions: 8, rows: 1248, treated_share: 0.35, untreated_share: 0.4, treatment_levels: 6, gap_share: 0.0}
expected:
  decision: identified
  adjustment_set: [holiday_weeks]
  x_cols: [holiday]
  fixed_effects: [region]
  cate_covariates: []
  warnings:
    - {code: few_regions}
