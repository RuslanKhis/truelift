schema: truelift.golden/1
id: g23_modifier_caused_by_discount
title: Basket size is named as an effect modifier but the discount causes it
covers: [cate, treatment_descendant, mediator_trap]
template: store_chain
rationale: >-
  The user said discounts work better when baskets are bigger, but also agreed that discounts
  make baskets bigger. A CATE covariate must be fixed before the discount happens; one the
  discount changes would split the effect by part of the effect itself. The run is blocked
  until the user drops basket size as a modifier or the edge from the discount.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
    - {id: basket_size, role: mediator, column: avg_basket_value}
  edges:
    - [discount, sales]
    - [discount, basket_size]
    - [basket_size, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
  modifiers: [basket_size]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
    - {name: avg_basket_value, role: control, type: index}
data: {weeks: 156, regions: 8, rows: 1248, treated_share: 0.35, untreated_share: 0.4, treatment_levels: 6, gap_share: 0.0}
expected:
  decision: blocked
  blocks:
    - {code: descendant_in_controls, node_ids: [basket_size]}
