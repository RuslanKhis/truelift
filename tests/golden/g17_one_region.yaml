schema: truelift.golden/1
id: g17_one_region
title: National data only, one region
covers: [low_variation, panel_shape]
template: online_shop
rationale: >-
  The file has one region, so there is no second region to compare with, and 156 rows, below
  the 200 that five-fold cross-fitting needs. Both blocks are shown, so the user knows that
  regional data fixes both at once.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
  edges:
    - [discount, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: holiday, role: control, type: flag}
data: {weeks: 156, regions: 1, rows: 156, treated_share: 0.35, untreated_share: 0.4, treatment_levels: 6, gap_share: 0.0}
expected:
  decision: blocked
  blocks:
    - {code: too_few_regions, remedies: [add_data]}
    - {code: too_few_rows, remedies: [add_data]}
