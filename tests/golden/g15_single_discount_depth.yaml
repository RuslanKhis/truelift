schema: truelift.golden/1
id: g15_single_discount_depth
title: Every discount had the same depth
covers: [low_variation]
template: subscription_service
rationale: >-
  The introductory offer was always the same 20% off. With one depth, plus the zero weeks, the
  response to a deeper or shallower offer is a line through two points, below the three levels
  in rules/identification.yaml, so the run is blocked.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
  edges:
    - [discount, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
data: {weeks: 156, regions: 8, rows: 1248, treated_share: 0.3, untreated_share: 0.7, treatment_levels: 1, gap_share: 0.0}
expected:
  decision: blocked
  blocks:
    - {code: too_few_treatment_levels, remedies: [add_data]}
