schema: truelift.golden/1
id: g04_mediator_labelled_predictor
title: Branded search is labelled a sales driver but the discount causes it
covers: [mediator_trap, treatment_descendant]
template: online_shop
rationale: >-
  The user agreed both that branded search drives sales and that the discount makes people
  search for the brand. Labelled as a sales driver it would become a control, but it lies on the
  path from the discount to sales. The DAG contradicts itself, so the run is blocked until the
  user either marks branded search as something the discount changes or removes that edge.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
    - {id: branded_search, role: predictor, column: brand_search_volume}
  edges:
    - [discount, sales]
    - [discount, branded_search]
    - [branded_search, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
    - {name: brand_search_volume, role: control, type: volume}
data: {weeks: 156, regions: 8, rows: 1248, treated_share: 0.35, untreated_share: 0.4, treatment_levels: 6, gap_share: 0.0}
expected:
  decision: blocked
  blocks:
    - {code: descendant_in_controls, node_ids: [branded_search]}
