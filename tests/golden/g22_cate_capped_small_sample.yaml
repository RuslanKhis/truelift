schema: truelift.golden/1
id: g22_cate_capped_small_sample
title: Four effect modifiers on a short panel
covers: [cate]
template: brand_via_retailers
rationale: >-
  The user named four situations where discounts may work differently, but rules/cate.yaml
  allows three. The first three by column name are kept and weighted_distribution is reported
  as not used. With 624 rows (8 regions, 78 weeks) the panel is under 1,000 rows, so the degree
  stays at 2 and a small-sample note is shown. All four remain controls.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
    - {id: season, role: confounder, column: season_index}
    - {id: distribution, role: confounder, column: weighted_distribution}
    - {id: media, role: confounder, column: media_grps}
  edges:
    - [discount, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
    - [season, discount]
    - [season, sales]
    - [distribution, discount]
    - [distribution, sales]
    - [media, discount]
    - [media, sales]
  modifiers: [distribution, holiday_weeks, media, season]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
    - {name: season_index, role: control, type: index}
    - {name: weighted_distribution, role: control, type: rate, bounded_0_1: true}
    - {name: media_grps, role: control, type: index}
data: {weeks: 78, regions: 8, rows: 624, treated_share: 0.35, untreated_share: 0.4, treatment_levels: 6, gap_share: 0.0}
expected:
  decision: identified
  adjustment_set: [distribution, holiday_weeks, media, season]
  x_cols: [holiday, media_grps, season_index, weighted_distribution]
  fixed_effects: [region]
  cate_covariates: [holiday, media_grps, season_index]
  cate_degree: 2
  warnings:
    - {code: cate_capped, subjects: [weighted_distribution]}
    - {code: cate_small_sample}
    - {code: few_regions}
