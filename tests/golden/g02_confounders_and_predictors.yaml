schema: truelift.golden/1
id: g02_confounders_and_predictors
title: Several confounders plus predictors without data
covers: [backdoor, normalisation]
template: brand_via_retailers
rationale: >-
  Holidays, season, distribution and advertising each drive both the discount and sales, and all
  four have data, so all four are controls. Competitor promotions and the economic mood only move
  sales; having no data for them costs precision but not identification, so the run is not
  blocked. Advertising GRPs and the season index are divided by their median; the distribution
  share and the holiday flag are left as they are.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
    - {id: season, role: confounder, column: season_index}
    - {id: distribution, role: confounder, column: weighted_distribution}
    - {id: media, role: confounder, column: media_grps}
    - {id: competitor_promo, role: predictor}
    - {id: macro_conditions, role: predictor}
  edges:
    - [discount, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
    - [season, discount]
    - [season, sales]
    - [distribution, discount]
    - [distribution, sales]
    - [media, discount]
    - [media, sales]
    - [competitor_promo, sales]
    - [macro_conditions, sales]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
    - {name: season_index, role: control, type: index}
    - {name: weighted_distribution, role: control, type: rate, bounded_0_1: true}
    - {name: media_grps, role: control, type: index}
data: {weeks: 156, regions: 8, rows: 1248, treated_share: 0.35, untreated_share: 0.4, treatment_levels: 6, gap_share: 0.0}
expected:
  decision: identified
  adjustment_set: [distribution, holiday_weeks, media, season]
  x_cols: [holiday, media_grps, season_index, weighted_distribution]
  fixed_effects: [region]
  cate_covariates: []
  warnings:
    - {code: few_regions}
  compile:
    treatment_types: {discount_rate: percentage}
    sales_col: revenue
    treatment_spend_cols: {discount_rate: discount_spend}
    opt_threshold_roi: 1.0
    scalers:
      median_normalize_cols: [media_grps, season_index]
