schema: truelift.golden/1
id: g10_collider_left_out
title: Retailer listings are a collider and are left out
covers: [collider]
template: brand_via_retailers
rationale: >-
  How many retailers list the product depends on the price pressure that also makes the brand
  discount, and on brand strength, which also lifts sales. Listings themselves lead to neither
  the discount nor sales here. The path discount <- price_pressure -> listings <- brand_strength
  -> sales is closed while listings are left alone and would open if they were controlled for.
  So listings are left out, even though the user thought of them as a sales driver, and the
  user is told why.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
    - {id: retailer_listings, role: predictor, column: listing_count}
    - {id: price_pressure}
    - {id: brand_strength}
  edges:
    - [discount, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
    - [price_pressure, discount]
    - [price_pressure, retailer_listings]
    - [brand_strength, retailer_listings]
    - [brand_strength, sales]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
    - {name: listing_count, role: control, type: count}
data: {weeks: 156, regions: 8, rows: 1248, treated_share: 0.35, untreated_share: 0.4, treatment_levels: 6, gap_share: 0.0}
expected:
  decision: identified
  adjustment_set: [holiday_weeks]
  x_cols: [holiday]
  fixed_effects: [region]
  cate_covariates: []
  warnings:
    - {code: few_regions}
    - {code: left_out, subjects: [retailer_listings]}
