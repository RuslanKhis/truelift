schema: truelift.golden/1
id: g14_always_discounting
title: A discount runs in nearly every region-week
covers: [low_variation]
template: food_service
rationale: >-
  The business ran some offer in 98% of region-weeks, so only 2% show sales without one, below
  the 5% minimum. The no-discount baseline would be an extrapolation, so ROI against "no
  discount" cannot be measured and the run is blocked.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
  edges:
    - [discount, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
data: {weeks: 156, regions: 8, rows: 1248, treated_share: 0.98, untreated_share: 0.02, treatment_levels: 5, gap_share: 0.0}
expected:
  decision: blocked
  blocks:
    - {code: too_few_untreated_rows, remedies: [add_data]}
