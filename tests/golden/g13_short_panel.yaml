schema: truelift.golden/1
id: g13_short_panel
title: Less than a year of weeks
covers: [low_variation]
template: store_chain
rationale: >-
  Forty weeks do not cover a full year, so some seasons and holidays are never seen and the
  discount calendar cannot be told apart from them. The panel has enough rows (320, above 200),
  so the only block is the number of weeks.
dag:
  treatment: discount
  outcome: sales
  nodes:
    - {id: discount, role: treatment, column: discount_rate}
    - {id: sales, role: outcome, column: revenue}
    - {id: holiday_weeks, role: confounder, column: holiday}
  edges:
    - [discount, sales]
    - [holiday_weeks, discount]
    - [holiday_weeks, sales]
mapping:
  columns:
    - {name: week, role: date, type: date}
    - {name: region, role: region, type: key}
    - {name: revenue, role: outcome, type: money}
    - {name: discount_rate, role: treatment_rate, type: rate, bounded_0_1: true}
    - {name: discount_spend, role: treatment_spend, type: money}
    - {name: population, role: population, type: count}
    - {name: holiday, role: control, type: flag}
data: {weeks: 40, regions: 8, rows: 320, treated_share: 0.35, untreated_share: 0.4, treatment_levels: 6, gap_share: 0.0}
expected:
  decision: blocked
  blocks:
    - {code: too_few_weeks, remedies: [add_data]}
